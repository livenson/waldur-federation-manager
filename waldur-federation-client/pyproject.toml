[project]
name = "waldur-federation-client"
version = "0.1.0"
description = "Client library for integrating Waldur instances with OpenID Federation 1.0 Trust Anchors"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.26.0",
    "authlib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
